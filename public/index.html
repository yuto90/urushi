<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urushi - AI Slide Prototype</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AI Slide Generator Prototype</p>
      <h1>Urushi</h1>
    </div>
    <nav class="header-actions" aria-label="補助リンク">
      <a href="/examples/sample.html" target="_blank" rel="noreferrer">サンプルを開く</a>
      <a href="https://github.com/yuto90/urushi" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
  </header>

  <main class="workspace">
    <section class="input-panel" aria-labelledby="input-title">
      <div class="panel-heading">
        <p class="eyebrow">Brief</p>
        <h2 id="input-title">作りたいスライドの概要</h2>
      </div>
      <textarea id="prompt" spellcheck="false">新しい社内業務改善SaaSの導入提案。現状の課題、解決策、導入効果、3か月の導入ロードマップ、次の意思決定を5枚で説明してほしい。経営層向けに簡潔で信頼感のあるデザイン。</textarea>
      <div class="input-meta">
        <span id="character-count">0 文字</span>
        <label class="sample-toggle">
          <input type="checkbox" id="force-sample">
          サンプルで確認
        </label>
      </div>
      <button id="generate" class="primary-button" type="button">スライドを生成</button>
      <p class="note">ANTHROPIC_API_KEY が未設定の場合は、LLMの代わりに同梱サンプルを返します。</p>
      <div id="status" class="status" role="status" aria-live="polite">概要を入力して生成してください。</div>
    </section>

    <section class="preview-panel" aria-labelledby="preview-title">
      <div class="preview-toolbar">
        <div>
          <p class="eyebrow">Preview</p>
          <h2 id="preview-title">生成結果</h2>
        </div>
        <div class="preview-actions">
          <button id="download" type="button" disabled>HTMLをダウンロード</button>
          <button id="open-tab" type="button" disabled>別タブで開く</button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="preview" title="生成されたスライドのプレビュー" sandbox="allow-scripts"></iframe>
        <div id="empty-state" class="empty-state">
          <strong>まだ生成されていません</strong>
          <span>左の概要から生成すると、ここに16:9スライドが表示されます。</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
