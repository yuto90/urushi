<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urushi</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="mark">漆</div>
      <div>
        <p class="eyebrow">Schema-driven AI slide studio</p>
        <h1>Urushi</h1>
      </div>
    </div>
    <div class="header-note">generate → render → check → fix → export</div>
  </header>

  <main class="workspace">
    <aside class="control-panel">
      <section class="panel-section">
        <div class="section-heading">
          <span>01</span>
          <h2>概要</h2>
        </div>
        <textarea id="overview" spellcheck="false">営業支援AIの導入企画。現状の課題、AI支援運用との比較、効果が生まれる因果、3か月の導入手順、成功条件を経営層向けに5枚で説明してほしい。</textarea>
        <div class="form-row">
          <label for="provider">AI provider</label>
          <select id="provider">
            <option value="vertex-gemini">Vertex AI / Gemini</option>
            <option value="vertex-claude">Vertex AI / Claude</option>
            <option value="mock">Mock</option>
          </select>
        </div>
        <button id="generate" class="primary-button" type="button">生成して自己修正</button>
      </section>

      <section class="panel-section">
        <div class="section-heading">
          <span>02</span>
          <h2>進行状況</h2>
        </div>
        <div id="status" class="status" role="status" aria-live="polite">概要を入力して生成してください。</div>
        <ol id="iterations" class="iterations"></ol>
      </section>

      <section class="panel-section errors-section">
        <div class="section-heading">
          <span>03</span>
          <h2>検証エラー</h2>
        </div>
        <div id="errors" class="errors empty">まだ検証していません。</div>
      </section>

      <section class="panel-section yaml-section">
        <div class="section-heading">
          <span>04</span>
          <h2>deck.yaml</h2>
        </div>
        <textarea id="yaml-editor" spellcheck="false" placeholder="生成後に YAML を編集できます"></textarea>
        <button id="rebuild" class="secondary-button" type="button" disabled>YAMLを再ビルド</button>
      </section>
    </aside>

    <section class="preview-panel">
      <div class="preview-toolbar">
        <div>
          <p class="eyebrow">Preview</p>
          <h2>出力デッキ</h2>
        </div>
        <div class="preview-actions">
          <button id="open-tab" type="button" disabled>別タブ</button>
          <button id="export" type="button" disabled>PDF/PPTXを書き出し</button>
          <a id="download-pdf" class="download disabled" href="#">PDF</a>
          <a id="download-pptx" class="download disabled" href="#">PPTX</a>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="preview" title="生成されたスライドのプレビュー" sandbox="allow-scripts allow-same-origin"></iframe>
        <div id="empty-state" class="empty-state">
          <strong>まだ生成されていません</strong>
          <span>生成が終わると、ここに16:9スライドが表示されます。</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
