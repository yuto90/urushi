name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: npm run build:demo
      - run: node --test tests/pages.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-editor
          path: dist/pages/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://urushi-demo.pages.dev/
    concurrency:
      group: urushi-demo-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-editor
          path: site
      - name: Check the current main commit
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on main. Skipping this upload.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: 22
      - name: Deploy the tested editor to Cloudflare Pages
        if: steps.revision.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.169.0'
          command: pages deploy site --project-name=urushi-demo --branch=main --commit-hash=${{ github.sha }}
      - name: Verify the production commit and homepage
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          project="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/urushi-demo"
          for _ in {1..12}; do
            if curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project" |
                 jq -e '.result.canonical_deployment.deployment_trigger.metadata.commit_hash == env.GITHUB_SHA' >/dev/null &&
               curl -fsS --max-time 15 "https://urushi-demo.pages.dev/?commit=$GITHUB_SHA" -o "$RUNNER_TEMP/public-index" &&
               cmp -s site/index.html "$RUNNER_TEMP/public-index"; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::Production does not match the tested commit and homepage.'
          exit 1
